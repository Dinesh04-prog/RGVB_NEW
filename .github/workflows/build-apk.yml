name: Build Kirana POS Android app (APK + Play bundle)

on:
  push:
    branches: [main]
  workflow_dispatch:       # lets you trigger manually from GitHub UI

jobs:
  build:
    # Pinned: ubuntu-latest moves to a new Ubuntu release on 2026-10-19; the Android SDK
    # steps below rely on this image's preinstalled SDK.
    runs-on: ubuntu-24.04

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - uses: actions/checkout@v4

      # ── 2. Build React web app ───────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: nexus-react-pos/package-lock.json

      - name: Install dependencies
        working-directory: nexus-react-pos
        run: npm ci

      - name: Build web app
        working-directory: nexus-react-pos
        run: npm run build
        env:
          VITE_GOOGLE_CLIENT_ID: "786802419853-8m6fpah9na9ecdhfc8fo8d55e3b5r728.apps.googleusercontent.com"
          VITE_APP_URL: "https://appassets.androidplatform.net"
          VITE_FIREBASE_API_KEY: "AIzaSyArkZiqGAUJRqiBKQmYndBWTfpDq-4SWiM"
          VITE_FIREBASE_AUTH_DOMAIN: "nexus-pos-817c3.firebaseapp.com"
          VITE_FIREBASE_PROJECT_ID: "nexus-pos-817c3"
          VITE_FIREBASE_STORAGE_BUCKET: "nexus-pos-817c3.firebasestorage.app"
          VITE_FIREBASE_MESSAGING_SENDER_ID: "77380160715"
          VITE_FIREBASE_APP_ID: "1:77380160715:web:c6cd94906ee7fcc24b9f4e"
          VITE_FIREBASE_MEASUREMENT_ID: "G-QSGXW4SQLV"

      - name: Test item-name logic (bilingual names, short code, duplicates)
        working-directory: nexus-react-pos
        run: npm run test:names

      # ── 3. Copy web build into Android assets ────────────────────────────────
      - name: Copy dist → Android assets
        run: |
          mkdir -p nexus-android/app/src/main/assets
          cp -r nexus-react-pos/dist/. nexus-android/app/src/main/assets/

      # ── 5. Build Android APK ─────────────────────────────────────────────────
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      # The runner image ships the Android SDK (ANDROID_HOME=/usr/local/lib/android/sdk).
      # Use its own sdkmanager by absolute path: no third-party action, no cmdline-tools download,
      # and no legacy 'tools' package (Google no longer serves it, which broke setup-android@v3).
      - name: Set up Android SDK (preinstalled on the runner)
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?ANDROID_HOME is not set on this runner image}"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER" || { echo "sdkmanager not found at $SDKMANAGER"; ls "$ANDROID_HOME/cmdline-tools" || true; exit 1; }
          "$SDKMANAGER" --version
          # 'yes' is killed by SIGPIPE when sdkmanager stops reading; don't let pipefail treat that as an error
          (yes || true) | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;35.0.0" "platform-tools"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Install Gradle 8.14.3
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.14.3-bin.zip -O /tmp/gradle.zip
          sudo unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.14.3/bin" >> $GITHUB_PATH

      # Release signing for Google Play. Secrets (Settings → Secrets → Actions): KEYSTORE_BASE64 (the .jks file as
      # base64), KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD. Without them the build is signed with the debug key
      # (fine to install and test, not accepted by Play).
      - name: Release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Signing with the release key"
          else
            echo "::warning::No KEYSTORE_BASE64 secret: signed with the debug key (not for Google Play)"
          fi

      # Label parser tests (pure JVM). A failure stops the build before the APK is made.
      - name: Run unit tests
        working-directory: nexus-android
        run: gradle testDebugUnitTest --no-daemon
        # Gemini Worker URL and app key (optional). Empty when the secrets are not set: Gemini is off.
        # GitHub masks secret values in the log; the build never prints them.
        env:
          GEMINI_WORKER_URL: ${{ secrets.GEMINI_WORKER_URL }}
          GEMINI_APP_KEY: ${{ secrets.GEMINI_APP_KEY }}

      - name: Build release APK and Play bundle (AAB)
        working-directory: nexus-android
        run: gradle assembleRelease bundleRelease --no-daemon
        env:
          GEMINI_WORKER_URL: ${{ secrets.GEMINI_WORKER_URL }}
          GEMINI_APP_KEY: ${{ secrets.GEMINI_APP_KEY }}
          # Every build gets a higher version number (Play requires it): the GitHub run number
          VERSION_CODE: ${{ github.run_number }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Print APK size
        run: |
          APK=nexus-android/app/build/outputs/apk/release/app-release.apk
          echo "APK size: $(du -h "$APK" | cut -f1) ($(stat -c %s "$APK") bytes)"

      # ── 6. Upload APK as downloadable artifact ───────────────────────────────
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KiranaPOS-${{ github.run_number }}
          path: nexus-android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      # The file to upload to the Google Play Console
      - name: Upload Play bundle (AAB)
        uses: actions/upload-artifact@v4
        with:
          name: KiranaPOS-${{ github.run_number }}-play-bundle
          path: nexus-android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      # ── 7. Print download instructions in the run log ────────────────────────
      - name: Print install instructions
        run: |
          echo "========================================"
          echo "  APK build complete!"
          echo "  Go to: Actions tab → this run → Artifacts"
          echo "  Download: KiranaPOS-${{ github.run_number }} (APK) or -play-bundle (AAB for Google Play)"
          echo "  Transfer to phone → install → allow 'Install unknown apps'"
          echo "========================================"
