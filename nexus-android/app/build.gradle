import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Release signing (Google Play). From the environment / GitHub secrets: KEYSTORE_FILE (path to the .jks),
// KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD. Without them the release build is signed with the debug key
// (installable for testing, not accepted by Play).
def envOr = { String k -> (System.getenv(k) ?: '').trim() }
def releaseKeystore = envOr('KEYSTORE_FILE')
def hasReleaseKey = releaseKeystore && file(releaseKeystore).exists()

android {
    namespace 'com.nexuspos.app'
    compileSdk 36

    defaultConfig {
        applicationId "com.nexuspos.app"
        minSdk 26
        targetSdk 36
        // Every CI build gets a higher number (Play refuses an upload whose versionCode is not higher)
        versionCode (envOr('VERSION_CODE') ? envOr('VERSION_CODE').toInteger() : 1)
        versionName "2.0.${envOr('VERSION_CODE') ?: '0'}"

        // Bundled ML Kit models ship native code per CPU type; real phones are ARM.
        // Dropping x86/x86_64 keeps the APK ~8 MB smaller (emulators need an ARM image).
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }

        // "Fill from Photos" with Gemini: Worker URL and shared app key from the environment (GitHub secrets in CI).
        // Empty (local builds, forks) = Gemini off; the phone's own reading is used. Never printed.
        def env = { String k -> (System.getenv(k) ?: '').trim().replace('\\', '\\\\').replace('"', '\\"') }
        buildConfigField 'String', 'GEMINI_WORKER_URL', "\"${env('GEMINI_WORKER_URL')}\""
        buildConfigField 'String', 'GEMINI_APP_KEY', "\"${env('GEMINI_APP_KEY')}\""
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            if (hasReleaseKey) {
                storeFile file(releaseKeystore)
                storePassword envOr('KEYSTORE_PASSWORD')
                keyAlias envOr('KEY_ALIAS')
                keyPassword envOr('KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig hasReleaseKey ? signingConfigs.release : signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }


    testOptions {
        unitTests.all {
            // Print the parser accuracy table in the CI log
            testLogging {
                events 'passed', 'failed', 'skipped'
                showStandardStreams = true
                exceptionFormat 'full'
            }
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core-ktx:1.12.0'
    // WebViewAssetLoader — serves bundled assets at a real HTTPS origin
    implementation 'androidx.webkit:webkit:1.10.0'

    // Add item from photos — camera + on-device ML Kit (bundled models, no network, no API key).
    def camerax = '1.4.2'
    implementation "androidx.camera:camera-core:$camerax"
    implementation "androidx.camera:camera-camera2:$camerax"
    implementation "androidx.camera:camera-lifecycle:$camerax"
    implementation "androidx.camera:camera-view:$camerax"
    implementation 'com.google.mlkit:barcode-scanning:17.3.0'
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    implementation 'com.google.mlkit:text-recognition-devanagari:16.0.1'

    testImplementation 'junit:junit:4.13.2'
}

kotlin {
    compilerOptions {
        jvmTarget = JvmTarget.JVM_17
    }
}
