plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.nexuspos.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.nexuspos.app"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"

        // Bundled ML Kit models ship native code per CPU type; real phones are ARM.
        // Dropping x86/x86_64 keeps the APK ~8 MB smaller (emulators need an ARM image).
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // Sign release with debug key so the APK can be sideloaded directly.
            // To publish to Play Store, replace with a real signing config.
            signingConfig signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    testOptions {
        unitTests.all {
            // Print the parser accuracy table in the CI log
            testLogging {
                events 'passed', 'failed', 'skipped'
                showStandardStreams = true
                exceptionFormat 'full'
            }
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core-ktx:1.12.0'
    // WebViewAssetLoader — serves bundled assets at a real HTTPS origin
    implementation 'androidx.webkit:webkit:1.10.0'

    // Add item from photos — camera + on-device ML Kit (bundled models, no network, no API key).
    // CameraX 1.5+ needs compileSdk 35, so stay on 1.4.x with compileSdk 34.
    def camerax = '1.4.2'
    implementation "androidx.camera:camera-core:$camerax"
    implementation "androidx.camera:camera-camera2:$camerax"
    implementation "androidx.camera:camera-lifecycle:$camerax"
    implementation "androidx.camera:camera-view:$camerax"
    implementation 'com.google.mlkit:barcode-scanning:17.3.0'
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    implementation 'com.google.mlkit:text-recognition-devanagari:16.0.1'

    testImplementation 'junit:junit:4.13.2'
}
